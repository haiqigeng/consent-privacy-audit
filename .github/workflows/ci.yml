name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff>=0.12,<1"

      - name: Validate package contracts
        run: python -B scripts/validate_consent_delivery.py --package-only

      - name: Compile and lint
        run: |
          python -B -m compileall -q scripts tests
          ruff check scripts tests

      - name: Run unit and contract tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
