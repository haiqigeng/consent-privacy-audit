[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "consent-privacy-audit"
version = "1.0.10"
description = "Browser-level consent and tracker runtime audit for deployed public websites"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "playwright>=1.48,<2",
  "Pillow>=11,<12",
  "pytesseract>=0.3.13,<0.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]
browser = ["playwright>=1.48,<2"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
